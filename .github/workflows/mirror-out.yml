name: mirror-out
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: push repo to CNB voice + Gitee voice
        run: |
          set -e
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git clone --bare "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Cloisnee/moting-voice-materials-20261009.git" /tmp/src.git
          cd /tmp/src.git
          ok=0
          for i in 1 2 3 4 5; do
            echo "CNB push attempt $i"
            if git push --force --progress "https://cnb:1f1826sCdM4QRGld8BWEyXlqvNF@cnb.cool/Cloisnee/voice.git" refs/heads/main:refs/heads/main; then ok=1; break; fi
            sleep 20
          done
          [ "$ok" = "1" ] && echo "CNB-OK" || echo "CNB-FAIL"
          ok2=0
          for i in 1 2 3 4 5; do
            echo "Gitee push attempt $i"
            if git push --force --progress "https://cloisnee:bda253f2a63ef95df057edcb3d6ce9f6@gitee.com/cloisnee/voice.git" refs/heads/main:refs/heads/main; then ok2=1; break; fi
            sleep 20
          done
          [ "$ok2" = "1" ] && echo "GITEE-OK" || echo "GITEE-FAIL"
          [ "$ok" = "1" ] || exit 1
          echo ALLDONE
